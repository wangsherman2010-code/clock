<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clock Face</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="stage" aria-live="off">
  <div id="face"></div>
</main>

<button id="gear" aria-label="Settings" aria-expanded="false">⚙</button>

<button id="floatDone" hidden>Done</button>

<aside id="panel" hidden>
  <h2>Clock settings</h2>

  <fieldset>
    <legend>Face</legend>
    <label class="seg"><input type="radio" name="style" value="digital"><span>Digital</span></label>
    <label class="seg"><input type="radio" name="style" value="analog"><span>Analog</span></label>
  </fieldset>

  <fieldset id="sizeSet">
    <legend>Digital size</legend>
    <label class="row">Hour <select id="sizeHour"></select></label>
    <label class="row">Minute <select id="sizeMinute"></select></label>
    <label class="row" id="secSizeRow">Second <select id="sizeSecond"></select></label>
    <div class="row" id="zoomRow">Font size
      <span class="zoom"><button id="zoomOut" aria-label="Smaller">−</button><output id="zoomVal">100%</output><button id="zoomIn" aria-label="Larger">+</button></span>
    </div>
    <div class="row"><button id="zoomFit" class="wide">Fit to screen</button><button id="zoomAuto" class="wide">Auto</button></div>
  </fieldset>

  <fieldset>
    <legend>Options</legend>
    <label class="row check"><input type="checkbox" id="seconds"> Show seconds</label>
    <label class="row check" id="sepRow"><input type="checkbox" id="showSep"> Show separator ( : ) (digital)</label>
    <label class="row check" id="h24row"><input type="checkbox" id="h24"> 24-hour (digital)</label>
    <label class="row check" id="tickRow"><input type="checkbox" id="ticks"> Show numbers / ticks (analog)</label>
  </fieldset>

  <fieldset>
    <legend id="colorLegend">Colors</legend>
    <label class="row">Hour <input type="color" id="colorHour"></label>
    <label class="row">Minute <input type="color" id="colorMinute"></label>
    <label class="row" id="secColorRow">Second <input type="color" id="colorSecond"></label>
    <label class="row" id="sepColorRow">Separator ( : ) <input type="color" id="colorSep"></label>
    <label class="row">Background <input type="color" id="colorBg"></label>
  </fieldset>

  <div class="actions">
    <button id="reset">Reset</button>
    <button id="fs">Fullscreen</button>
    <button id="close">Done</button>
  </div>
</aside>

<video id="awake" loop muted playsinline webkit-playsinline width="2" height="2" style="position:fixed;left:0;bottom:0;opacity:.01;pointer-events:none"><source src="keepawake.webm" type="video/webm"><source src="keepawake.mp4" type="video/mp4"></video>

<script src="app.js"></script>
</body>
</html>
